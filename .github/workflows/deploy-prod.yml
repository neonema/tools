name: Deploy prod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Brand compliance
        run: npm run brand:check

      - name: JSON converter tests
        run: npm run test:json-converters

      - name: Password generator tests
        run: npm run test:password

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::029727239472:role/github-neonema-tools-deploy
          aws-region: us-east-1

      - name: Deploy platform
        env:
          DEPLOY_CONFIG: deploy.config.prod.json
        run: npm run deploy -- platform
