<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeoNema Tools</title>
    <meta
      name="description"
      content="Fast, private browser utilities by NeoNema — JSON Toolkit, RevealIP, and more."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <div class="brand">
          <img src="./NeoNema.png" alt="NeoNema" class="brand-main" />
        </div>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <p class="kicker">Utilities</p>
        <h1>NeoNema Tools</h1>
        <p class="hero-copy">
          Browser-first utilities — no signup, no server processing. Pick a tool below.
        </p>
      </section>

      <ul class="tool-list">
        <li>
          <a class="tool-card" href="/json/">
            <h2>JSON Toolkit</h2>
            <p>Validate, format, diff, and convert JSON in your browser.</p>
          </a>
        </li>
        <li>
          <a class="tool-card" href="/revealip/">
            <h2>RevealIP</h2>
            <p>See your public IPv4 and IPv6 addresses instantly.</p>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
