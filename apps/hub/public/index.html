<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeoNema Tools</title>
    <meta
      name="description"
      content="Fast, private browser utilities by NeoNema — JSON Toolkit, RevealIP, and more."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-inner hub-header-inner">
        <div class="brand">
          <img src="./NeoNema.png" alt="NeoNema" class="brand-main" />
        </div>
        <nav class="hub-nav" aria-label="NeoNema tools">
          <div id="tool-tabs" class="hub-tabs" role="tablist" aria-label="Tool tabs"></div>
        </nav>
      </div>
    </header>

    <main class="hub-main">
      <section id="tool-panel" class="tool-panel" role="tabpanel" aria-label="Active tool"></section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
